<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Design Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f9fa;
  --content-bg: #ffffff;
  --sidebar-bg: #f8f9fa;
  --sidebar-border: #e0e0e0;
  --accent: #4a1d96;
  --accent-light: #ede9fe;
  --text-primary: #202122;
  --text-secondary: #54595d;
  --link: #3b0764;
  --link-hover: #7c3aed;
  --table-border: #a2a9b1;
  --heading-border: #a2a9b1;
  --sidebar-w: 240px;
}

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg);
}

a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }

/* ── HEADER ── */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--accent);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

#header-logo {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  color: #fff;
  white-space: nowrap;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
#header-logo:hover { text-decoration: none; color: #e9d5ff; }
#header-logo .logo-icon {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

#header-search {
  flex: 1;
  max-width: 420px;
}
#header-search input {
  width: 100%;
  padding: 6px 12px;
  border: none;
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  outline: none;
}
#header-search input::placeholder { color: rgba(255,255,255,0.6); }
#header-search input:focus { background: rgba(255,255,255,0.25); }

#hamburger {
  display: none;
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 4px 8px;
}

/* ── LAYOUT ── */
#layout {
  display: flex;
  margin-top: 52px;
  min-height: calc(100vh - 52px);
}

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  height: calc(100vh - 52px);
  overflow-y: auto;
  position: sticky;
  top: 52px;
  flex-shrink: 0;
}

#sidebar-search-wrap {
  padding: 10px 12px 6px;
  border-bottom: 1px solid var(--sidebar-border);
}
#sidebar-search {
  width: 100%;
  padding: 5px 10px;
  border: 1px solid var(--sidebar-border);
  border-radius: 4px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  background: #fff;
  color: var(--text-primary);
  outline: none;
}
#sidebar-search:focus { border-color: var(--accent); }

.sidebar-section { border-bottom: 1px solid var(--sidebar-border); }
.sidebar-section-header {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  user-select: none;
}
.sidebar-section-title {
  flex: 1;
  padding: 8px 4px 6px 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
}
.sidebar-section-title:hover { color: var(--accent); background: var(--accent-light); }
.sidebar-section-title.active { color: var(--accent); background: var(--accent-light); }
.chevron-btn {
  background: none;
  border: none;
  padding: 8px 12px 6px 4px;
  cursor: pointer;
  color: var(--text-secondary);
}
.chevron-btn:hover { color: var(--accent); }
.sidebar-section-header .chevron {
  font-size: 10px;
  transition: transform 0.2s;
  display: inline-block;
}
.sidebar-section.collapsed .chevron { transform: rotate(-90deg); }
.sidebar-section-links { list-style: none; }
.sidebar-section.collapsed .sidebar-section-links { display: none; }
.sidebar-section-links li a {
  display: block;
  padding: 4px 12px 4px 20px;
  font-size: 13px;
  color: var(--text-primary);
  border-left: 2px solid transparent;
  line-height: 1.4;
}
.sidebar-section-links li a:hover {
  color: var(--link-hover);
  background: var(--accent-light);
  border-left-color: var(--accent);
  text-decoration: none;
}
.sidebar-section-links li a.active {
  color: var(--accent);
  background: var(--accent-light);
  border-left-color: var(--accent);
  font-weight: 500;
}
.sidebar-subgroup-divider {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
  padding: 10px 12px 4px 20px;
  list-style: none;
}
.sidebar-subgroup-divider:first-child { padding-top: 4px; }

/* ── MAIN CONTENT ── */
#main {
  flex: 1;
  min-width: 0;
  padding: 0;
  background: var(--bg);
}

#content {
  max-width: 960px;
  margin: 0 auto;
  background: var(--content-bg);
  padding: 24px 36px 48px;
  min-height: calc(100vh - 52px);
  border-left: 1px solid #e9e9e9;
  border-right: 1px solid #e9e9e9;
}

/* ── BREADCRUMB ── */
#breadcrumb {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}
#breadcrumb a { color: var(--text-secondary); }
#breadcrumb a:hover { color: var(--link-hover); }
#breadcrumb span { margin: 0 5px; }

/* ── ARTICLE TITLE ── */
.article-title {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--text-primary);
  border-bottom: 1px solid var(--heading-border);
  padding-bottom: 6px;
  margin-bottom: 16px;
  line-height: 1.2;
}

/* ── TABLE OF CONTENTS ── */
#toc {
  background: var(--bg);
  border: 1px solid var(--table-border);
  display: inline-block;
  padding: 10px 16px 10px 10px;
  margin-bottom: 20px;
  font-size: 13px;
  min-width: 200px;
  max-width: 340px;
  float: right;
  margin-left: 24px;
}
#toc-title {
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
}
#toc ol { padding-left: 18px; }
#toc ol li { margin: 2px 0; }
#toc ol li a { color: var(--link); font-size: 12.5px; }
#toc ol li a:hover { color: var(--link-hover); }

/* ── ARTICLE CONTENT STYLES ── */
#article-body { clear: both; }
#article-body::after { content: ''; display: table; clear: both; }

#article-body h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  font-weight: 400;
  color: var(--text-primary);
  border-bottom: 1px solid var(--heading-border);
  padding-bottom: 4px;
  margin: 24px 0 12px;
}
#article-body h2 {
  font-family: 'DM Sans', sans-serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  border-bottom: 1px solid var(--heading-border);
  padding-bottom: 4px;
  margin: 22px 0 10px;
}
#article-body h3 {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 18px 0 8px;
}
#article-body h4 {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin: 14px 0 6px;
}
#article-body p { margin: 0 0 10px; }
#article-body ul, #article-body ol {
  padding-left: 24px;
  margin: 6px 0 10px;
}
#article-body li { margin: 2px 0; }
#article-body strong { font-weight: 600; }
#article-body em { font-style: italic; }

#article-body table {
  border-collapse: collapse;
  width: 100%;
  margin: 12px 0;
  font-size: 13px;
}
#article-body th {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
  padding: 6px 10px;
  border: 1px solid var(--table-border);
  text-align: left;
}
#article-body td {
  padding: 5px 10px;
  border: 1px solid var(--table-border);
  vertical-align: top;
}
#article-body tr:nth-child(even) td { background: #fafafa; }

#article-body blockquote {
  border-left: 3px solid var(--accent);
  margin: 12px 0;
  padding: 8px 16px;
  background: var(--accent-light);
  color: var(--text-secondary);
  font-style: italic;
}

#article-body code {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  background: #f4f4f4;
  padding: 1px 4px;
  border-radius: 3px;
  color: #c7254e;
}

#article-body hr {
  border: none;
  border-top: 1px solid var(--heading-border);
  margin: 20px 0;
}

/* ── RELATED ARTICLES ── */
#related-section {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--heading-border);
}
#related-section h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.related-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.related-pill {
  display: inline-block;
  padding: 4px 12px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: 20px;
  font-size: 12px;
  text-decoration: none;
  border: 1px solid #ddd6fe;
}
.related-pill:hover {
  background: var(--accent);
  color: #fff;
  text-decoration: none;
}

/* ── HOME PAGE ── */
#home-header {
  background: linear-gradient(135deg, var(--accent) 0%, #6d28d9 100%);
  color: #fff;
  padding: 40px 36px 36px;
  margin: -24px -36px 24px;
}
#home-header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 36px;
  font-weight: 400;
  margin-bottom: 8px;
}
#home-header .subtitle {
  font-size: 15px;
  opacity: 0.85;
  max-width: 560px;
}

.home-grid {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 20px;
  margin-bottom: 28px;
}
@media (max-width: 700px) {
  .home-grid { grid-template-columns: 1fr; }
}

.home-intro {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  padding: 18px 20px;
}
.home-intro h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  font-weight: 400;
  margin-bottom: 10px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--heading-border);
  padding-bottom: 5px;
}
.home-intro p {
  font-size: 14px;
  line-height: 1.65;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.home-quick-nav {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  padding: 18px 16px;
}
.home-quick-nav h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  font-weight: 400;
  margin-bottom: 12px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--heading-border);
  padding-bottom: 5px;
}
.quick-nav-group { margin-bottom: 14px; }
.quick-nav-group h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.quick-nav-group ul { list-style: none; }
.quick-nav-group ul li a {
  font-size: 13px;
  color: var(--link);
  display: block;
  padding: 2px 0;
}
.quick-nav-group ul li a:hover { color: var(--link-hover); }

.home-section-title {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text-primary);
  border-bottom: 1px solid var(--heading-border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.home-section-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  margin: 0 0 18px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
@media (max-width: 680px) {
  .cards-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) {
  .cards-grid { grid-template-columns: 1fr; }
}

.section-card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-decoration: none;
  display: block;
}
.section-card:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(74,29,150,0.1);
  text-decoration: none;
}
.section-card .card-icon {
  font-size: 22px;
  margin-bottom: 8px;
}
.section-card .card-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  display: block;
  text-decoration: none;
}
.section-card .card-title:hover { color: var(--accent); }
.section-card .card-count {
  font-size: 12px;
  color: var(--text-secondary);
}
.section-card .card-links {
  margin-top: 8px;
  font-size: 12px;
}
.section-card .card-links a {
  display: block;
  color: var(--link);
  padding: 1px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.section-card .card-links a:hover { color: var(--link-hover); text-decoration: none; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  #hamburger { display: block; }
  #sidebar {
    position: fixed;
    top: 52px;
    left: -260px;
    width: 240px;
    z-index: 99;
    transition: left 0.25s ease;
    box-shadow: 2px 0 8px rgba(0,0,0,0.15);
  }
  #sidebar.open { left: 0; }
  #content { padding: 16px 16px 40px; }
  #home-header { padding: 24px 16px 20px; margin: -16px -16px 16px; }
  #home-header h1 { font-size: 26px; }
  #toc { float: none; max-width: 100%; margin-left: 0; }
  .cards-grid { grid-template-columns: 1fr 1fr; }
}

/* ── SEARCH RESULTS ── */
.search-highlight {
  background: #fef08a;
  border-radius: 2px;
}
</style>
</head>
<body>

<header id="header">
  <button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
  <a href="#/" id="header-logo">
    <span class="logo-icon">&#9711;</span>
    HD Wiki
  </a>
  <div id="header-search">
    <input type="search" id="header-search-input" placeholder="Search Human Design Wiki..." oninput="handleHeaderSearch(this.value)" autocomplete="off">
  </div>
</header>

<div id="layout">
  <nav id="sidebar">
    <div id="sidebar-search-wrap">
      <input type="search" id="sidebar-search" placeholder="Filter articles..." oninput="handleSidebarSearch(this.value)" autocomplete="off">
    </div>
    <div id="sidebar-nav"></div>
  </nav>

  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
// ============================================================
// HD WIKI RUNTIME — markdown-first architecture (migrated 08.20.26)
// Content lives in content/<key>.md; nav + link data in manifest.json;
// full-text search in search-index.json (lazy-loaded).
// To add an article: drop a .md in content/ and run: node build.js
// ============================================================

let navSections = [], articlesMeta = {}, wikilinkMap = {}, WIKI = {};
let sidebarCollapsed = {};
const articleCache = {};
let searchIndex = null, searchIndexPromise = null;

function parseFrontmatter(raw) {
  if (!raw.startsWith('---')) return { meta: {}, content: raw };
  const end = raw.indexOf('\n---', 3);
  if (end < 0) return { meta: {}, content: raw };
  const head = raw.slice(3, end);
  const meta = {};
  for (const line of head.split('\n')) {
    const m = line.match(/^(\w[\w-]*):\s*(.*)$/);
    if (!m) continue;
    let v = m[2].trim();
    try { v = JSON.parse(v); } catch (e) { /* keep as string */ }
    meta[m[1]] = v;
  }
  return { meta, content: raw.slice(end + 4).replace(/^\n+/, '') };
}

async function getArticle(key) {
  if (articleCache[key]) return articleCache[key];
  if (!articlesMeta[key]) return null;
  const res = await fetch('content/' + key + '.md');
  if (!res.ok) return null;
  const parsed = parseFrontmatter(await res.text());
  const art = {
    title: parsed.meta.title || articlesMeta[key].title,
    section: parsed.meta.section || articlesMeta[key].section,
    related: parsed.meta.related || [],
    content: parsed.content
  };
  articleCache[key] = art;
  return art;
}

function ensureSearchIndex() {
  if (searchIndex) return Promise.resolve(searchIndex);
  if (!searchIndexPromise) {
    searchIndexPromise = fetch('search-index.json')
      .then(r => r.json())
      .then(j => { searchIndex = j; return j; });
  }
  return searchIndexPromise;
}

function resolveWikilink(text) {
  const lower = text.toLowerCase().trim();
  if (wikilinkMap[lower]) return '#/' + wikilinkMap[lower];
  for (const [k, v] of Object.entries(wikilinkMap)) {
    if (lower.includes(k) || k.includes(lower)) return '#/' + v;
  }
  return null;
}
// ── MARKDOWN RENDERER ──
function renderMarkdown(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inOl = false, inTable = false, tableHeader = false;
  let tableRows = [];

  function closeList() {
    if (inUl) { html += '</ul>\n'; inUl = false; }
    if (inOl) { html += '</ol>\n'; inOl = false; }
  }
  function closeTable() {
    if (inTable) {
      html += renderTable(tableRows);
      tableRows = [];
      inTable = false;
      tableHeader = false;
    }
  }

  function renderTable(rows) {
    if (rows.length === 0) return '';
    let out = '<table>\n';
    let headerDone = false;
    let sepIdx = -1;
    // Find separator row (---)
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].every(c => /^[-: ]+$/.test(c))) { sepIdx = i; break; }
    }
    rows.forEach((cells, idx) => {
      if (idx === sepIdx) return;
      const isHeader = (sepIdx > 0 && idx < sepIdx) || (sepIdx === -1 && idx === 0 && !headerDone);
      if (isHeader && !headerDone) {
        out += '<thead><tr>';
        cells.forEach(c => out += `<th>${inlineMarkdown(c.trim())}</th>`);
        out += '</tr></thead>\n<tbody>\n';
        headerDone = true;
      } else {
        out += '<tr>';
        cells.forEach(c => out += `<td>${inlineMarkdown(c.trim())}</td>`);
        out += '</tr>\n';
      }
    });
    if (!headerDone && rows.length > 0) {
      // No header found, render all as body
      out = '<table>\n<tbody>\n';
      rows.forEach(cells => {
        out += '<tr>';
        cells.forEach(c => out += `<td>${inlineMarkdown(c.trim())}</td>`);
        out += '</tr>\n';
      });
    }
    out += '</tbody>\n</table>\n';
    return out;
  }

  function inlineMarkdown(t) {
    // Wikilinks [[Text]] or [[Text|Display]]
    t = t.replace(/\[\[([^\]]+?)(?:\|([^\]]+?))?\]\]/g, (_, target, display) => {
      const label = display || target;
      const href = resolveWikilink(target);
      if (href) return `<a href="${href}">${label}</a>`;
      return `<span class="wikilink-unresolved">${label}</span>`;
    });
    // Bold+Italic
    t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    // Bold
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    // Inline code
    t = t.replace(/`([^`]+?)`/g, '<code>$1</code>');
    return t;
  }

  let paraLines = [];
  function flushPara() {
    if (paraLines.length > 0) {
      const joined = paraLines.join(' ').trim();
      if (joined) html += `<p>${inlineMarkdown(joined)}</p>\n`;
      paraLines = [];
    }
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // Table row
    if (/^\s*\|/.test(line)) {
      flushPara();
      closeList();
      inTable = true;
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (cells.length > 0) tableRows.push(cells);
      continue;
    } else if (inTable) {
      closeTable();
    }

    // Blank line
    if (/^\s*$/.test(line)) {
      flushPara();
      closeList();
      continue;
    }

    // Headings
    const h4 = line.match(/^####\s+(.+)/);
    const h3 = line.match(/^###\s+(.+)/);
    const h2 = line.match(/^##\s+(.+)/);
    const h1 = line.match(/^#\s+(.+)/);

    if (h4) {
      flushPara(); closeList();
      const slug = h4[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h4 id="${slug}">${inlineMarkdown(h4[1])}</h4>\n`;
    } else if (h3) {
      flushPara(); closeList();
      const slug = h3[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h3 id="${slug}">${inlineMarkdown(h3[1])}</h3>\n`;
    } else if (h2) {
      flushPara(); closeList();
      const slug = h2[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h2 id="${slug}">${inlineMarkdown(h2[1])}</h2>\n`;
    } else if (h1) {
      flushPara(); closeList();
      const slug = h1[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h1 id="${slug}">${inlineMarkdown(h1[1])}</h1>\n`;
    }
    // HR
    else if (/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())) {
      flushPara(); closeList();
      html += '<hr>\n';
    }
    // Blockquote
    else if (/^>\s?/.test(line)) {
      flushPara(); closeList();
      html += `<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ''))}</blockquote>\n`;
    }
    // Unordered list
    else if (/^\s*[-*+]\s+/.test(line)) {
      flushPara();
      if (!inUl) { html += '<ul>\n'; inUl = true; }
      if (inOl) { html += '</ol>\n'; inOl = false; }
      const content = line.replace(/^\s*[-*+]\s+/, '');
      html += `<li>${inlineMarkdown(content)}</li>\n`;
    }
    // Ordered list
    else if (/^\s*\d+\.\s+/.test(line)) {
      flushPara();
      if (!inOl) { html += '<ol>\n'; inOl = true; }
      if (inUl) { html += '</ul>\n'; inUl = false; }
      const content = line.replace(/^\s*\d+\.\s+/, '');
      html += `<li>${inlineMarkdown(content)}</li>\n`;
    }
    // Regular paragraph text
    else {
      paraLines.push(line);
    }
  }

  flushPara();
  closeList();
  closeTable();

  return html;
}

// ── TABLE OF CONTENTS ──
function navigateTo(href) {
  window.location.hash = href.replace(/^#/, '');
}

function scrollToSection(slug) {
  const el = document.getElementById(slug);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.pageYOffset - 20;
  try { window.scrollTo({ top, behavior: 'smooth' }); } catch (e) {}
  if (window.pageYOffset !== top) window.scrollTo(0, top);
}

function buildTOC(content) {
  const h2s = [];
  const lines = content.split('\n');
  for (const line of lines) {
    const m = line.match(/^##\s+(.+)/);
    if (m) h2s.push(m[1]);
  }
  if (h2s.length < 2) return '';
  let toc = '<div id="toc"><div id="toc-title">Contents</div><ol>';
  h2s.forEach((h, i) => {
    const slug = h.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    toc += `<li><a href="javascript:void(0)" onclick="scrollToSection('${slug}')">${h}</a></li>`;
  });
  toc += '</ol></div>';
  return toc;
}

function toggleSection(key) {
  sidebarCollapsed[key] = !sidebarCollapsed[key];
  renderSidebar(document.getElementById('sidebar-search').value);
}

function handleSidebarSearch(val) {
  renderSidebar(val.trim() || null);
}

// ── ROUTING ──
function getCurrentArticleKey() {
  const hash = window.location.hash;
  if (!hash || hash === '#/' || hash === '#') return null;
  return hash.replace(/^#\//, '');
}

function getBreadcrumb(key, article) {
  const sectionKey = key.split('/')[0];
  const section = navSections.find(s => s.key === sectionKey);
  const sectionLabel = section ? section.label : sectionKey;
  const isSectionPage = !key.includes('/');

  if (isSectionPage) {
    return `<span><a href="#/">Home</a></span>
      <span>&rsaquo;</span>
      <span>${sectionLabel}</span>`;
  }

  return `<span><a href="#/">Home</a></span>
    <span>&rsaquo;</span>
    <span><a href="#/${sectionKey}">${sectionLabel}</a></span>
    <span>&rsaquo;</span>
    <span>${article.title}</span>`;
}

function renderArticle(key, article) {
  const content = document.getElementById('content');
  const toc = buildTOC(article.content);
  const body = renderMarkdown(article.content);
  const breadcrumb = getBreadcrumb(key, article);

  content.innerHTML = `
    <div id="breadcrumb">${breadcrumb}</div>
    <h1 class="article-title">${article.title}</h1>
    ${toc}
    <div id="article-body">${body}</div>
  `;
}

// ── SIDEBAR TOGGLE ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Close sidebar when clicking outside on mobile
document.addEventListener('click', function(e) {
  const sidebar = document.getElementById('sidebar');
  const hamburger = document.getElementById('hamburger');
  if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && e.target !== hamburger) {
      sidebar.classList.remove('open');
    }
  }
});


// ── SIDEBAR (async content filter via search index) ──
function renderSidebar(filter) {
  const nav = document.getElementById('sidebar-nav');
  const currentKey = getCurrentArticleKey();
  const f = filter ? filter.toLowerCase() : null;
  if (f && !searchIndex) { ensureSearchIndex().then(() => renderSidebar(filter)); }
  let html = '';
  for (const section of navSections) {
    const matchingArticles = f
      ? section.articles.filter(a =>
          a.divider ? false
          : a.label.toLowerCase().includes(f) ||
            (searchIndex && searchIndex[a.key] && searchIndex[a.key].x.toLowerCase().includes(f))
        )
      : section.articles;
    if (f && matchingArticles.length === 0) continue;
    const collapsed = !f && sidebarCollapsed[section.key];
    const sectionActive = section.key === currentKey ? ' active' : '';
    html += `<div class="sidebar-section${collapsed ? ' collapsed' : ''}" data-section="${section.key}">`;
    html += `<div class="sidebar-section-header">
      <a class="sidebar-section-title${sectionActive}" href="#/${section.key}">${section.label}</a>
      <button class="chevron-btn" onclick="toggleSection('${section.key}')" aria-label="Toggle ${section.label}"><span class="chevron">&#9660;</span></button>
    </div>`;
    html += '<ul class="sidebar-section-links">';
    for (const art of matchingArticles) {
      if (art.divider) { html += `<li class="sidebar-subgroup-divider">${art.divider}</li>`; continue; }
      const active = art.key === currentKey ? ' active' : '';
      html += `<li><a href="#/${art.key}" class="${active}">${art.label}</a></li>`;
    }
    html += '</ul></div>';
  }
  nav.innerHTML = html;
}

function handleHeaderSearch(val) {
  const q = val.trim();
  if (!q) { router(); return; }
  showSearchResults(q);
}

// ── ROUTER (async) ──
async function router() {
  const hash = window.location.hash;
  const content = document.getElementById('content');
  document.getElementById('header-search-input').value = '';

  if (!hash || hash === '#/' || hash === '#') {
    renderHome();
    renderSidebar(document.getElementById('sidebar-search').value);
    content.scrollTop = 0;
    window.scrollTo(0, 0);
    return;
  }

  const key = hash.replace(/^#\//, '');
  const article = await getArticle(key);

  if (!article) {
    content.innerHTML = `<div class="article-title">Not Found</div><p>Article "${key}" was not found.</p>`;
    renderSidebar(document.getElementById('sidebar-search').value);
    return;
  }

  renderArticle(key, article);
  renderSidebar(document.getElementById('sidebar-search').value);
  content.scrollTop = 0;
  window.scrollTo(0, 0);
}

// ── SEARCH RESULTS (index-based, async) ──
async function showSearchResults(query) {
  const content = document.getElementById('content');
  content.innerHTML = '<div id="breadcrumb"><a href="#/">Home</a> &rsaquo; Search</div><p style="color:var(--text-secondary)">Searching&hellip;</p>';
  const idx = await ensureSearchIndex();
  const q = query.toLowerCase();
  const results = [];

  for (const [key, art] of Object.entries(idx)) {
    const titleMatch = art.t.toLowerCase().includes(q);
    const ci = art.x.toLowerCase().indexOf(q);
    if (titleMatch || ci >= 0) {
      let snippet = '';
      if (ci >= 0) {
        const start = Math.max(0, ci - 80);
        const end = Math.min(art.x.length, ci + 160);
        snippet = art.x.slice(start, end).replace(/\s+/g, ' ').trim();
        const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        snippet = snippet.replace(re, m => `<mark class="search-highlight">${m}</mark>`);
      }
      results.push({ key, t: art.t, s: art.s, titleMatch, snippet });
    }
  }

  results.sort((a, b) => (b.titleMatch ? 1 : 0) - (a.titleMatch ? 1 : 0));

  const items = results.map(r => `
    <div style="padding: 12px 0; border-bottom: 1px solid #f0f0f0;">
      <a href="#/${r.key}" style="font-size:16px; font-weight:500; color:var(--link)">${r.t}</a>
      <div style="font-size:11px; color:var(--text-secondary); margin: 2px 0 4px">${r.s}</div>
      ${r.snippet ? `<div style="font-size:13px; color:var(--text-secondary); line-height:1.5">&hellip;${r.snippet}&hellip;</div>` : ''}
    </div>
  `).join('');

  content.innerHTML = `
    <div id="breadcrumb"><a href="#/">Home</a> &rsaquo; Search</div>
    <h1 class="article-title">Search: &ldquo;${query}&rdquo;</h1>
    <p style="color:var(--text-secondary); margin-bottom:16px">${results.length} article${results.length !== 1 ? 's' : ''} found</p>
    ${items || '<p>No articles found matching your search.</p>'}
  `;
}

// ── INIT ──

window.addEventListener('load', async () => {
  try {
    const res = await fetch('manifest.json');
    if (!res.ok) throw new Error('manifest fetch failed');
    const m = await res.json();
    WIKI = m.wiki || {};
    navSections = m.navSections || [];
    articlesMeta = m.articles || {};
    wikilinkMap = m.wikilinkMap || {};
    sidebarCollapsed = Object.fromEntries(navSections.map(s => [s.key, true]));
    renderSidebar(null);
    router();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<h1 class="article-title">This wiki needs a web server</h1>' +
      '<p>Browsers block loading local content files when index.html is opened directly.</p>' +
      '<p><strong>Live site:</strong> visit the published URL (GitHub Pages / Netlify).</p>' +
      '<p><strong>Local preview:</strong> run <code>python3 -m http.server</code> in this folder, then open <code>http://localhost:8000</code>.</p>';
  }
});
