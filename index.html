<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Design Wiki</title>
<meta name="description" content="A comprehensive reference for the Human Design System: types, strategy, authority, centers, gates, channels, profiles and incarnation crosses.">
<meta name="theme-color" content="#2b5f5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b5f5c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e8b89a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23e8b89a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("hdwiki-theme");if(!t)t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
/* ============================================================
   HUMAN DESIGN WIKI — The Art of Ease visual system
   Palette: Deep Teal / Charcoal / Soft Peach / Paper White /
            Soft Sage / Slate Mist / Golden Tan
   Type:    Outfit (display + UI) · Zilla Slab (body + emphasis)
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── BRAND TOKENS ── */
:root {
  --teal:        #2b5f5c;
  --teal-deep:   #224b49;
  --teal-soft:   #5f8a87;
  --charcoal:    #2e2e2e;
  --peach:       #e8b89a;
  --peach-wash:  #f7e7dc;
  --paper:       #fdfcf9;
  --paper-warm:  #f6f3ec;
  --sage:        #d4e3d0;
  --sage-wash:   #eaf1e8;
  --mist:        #b8c9c8;
  --tan:         #d4af77;
  --tan-wash:    #f2e6d2;

  --bg:            var(--paper-warm);
  --surface:       var(--paper);
  --surface-sunk:  var(--paper-warm);
  --header-bg:     var(--teal);
  --sidebar-bg:    var(--paper);
  --border:        #ded9cd;
  --border-strong: var(--mist);
  --text:          var(--charcoal);
  --text-muted:    #6d716f;
  --link:          var(--teal);
  --link-hover:    #8a5a3c;
  --accent:        var(--peach);
  --rule:          var(--mist);
  --shadow:        0 1px 2px rgba(46,46,46,.05), 0 8px 24px -12px rgba(43,95,92,.18);

  --sidebar-w: 264px;
  --header-h: 60px;
  --radius: 10px;
  color-scheme: light;
}

html[data-theme="dark"] {
  --bg:            #212423;
  --surface:       #2a2e2d;
  --surface-sunk:  #242726;
  --header-bg:     #1d3130;
  --sidebar-bg:    #262a29;
  --border:        #3a403f;
  --border-strong: #4a5250;
  --text:          #ece8df;
  --text-muted:    #a4b0ae;
  --link:          #e8b89a;
  --link-hover:    #d4af77;
  --rule:          #4a5250;
  --sage-wash:     #29332f;
  --peach-wash:    #3a2f28;
  --tan-wash:      #35301f;
  --shadow:        0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme: dark;
}

body {
  font-family: 'Zilla Slab', Georgia, serif;
  font-size: 17px;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; text-underline-offset: 2px; }

button, input { font-family: 'Outfit', system-ui, sans-serif; }

/* ── HEADER ── */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--header-bg);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 18px;
  z-index: 100;
  border-bottom: 1px solid rgba(0,0,0,.12);
}

#header-logo {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.01em;
  color: #fdfcf9;
  white-space: nowrap;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
#header-logo:hover { text-decoration: none; color: var(--peach); }
#header-logo .logo-icon {
  width: 30px; height: 30px;
  border: 1.5px solid var(--peach);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
#header-logo .logo-icon::after {
  content: '';
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--peach);
}
#header-logo .logo-word-2 { font-weight: 400; opacity: .78; }

#header-search { flex: 1; max-width: 460px; }
#header-search input {
  width: 100%;
  padding: 8px 14px;
  border: 1px solid rgba(253,252,249,.22);
  border-radius: 999px;
  font-size: 15px;
  background: rgba(253,252,249,.10);
  color: #fdfcf9;
  outline: none;
  transition: background .15s, border-color .15s;
}
#header-search input::placeholder { color: rgba(253,252,249,.55); }
#header-search input:focus { background: rgba(253,252,249,.18); border-color: var(--peach); }

#header-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }

.icon-btn {
  background: none;
  border: 1px solid rgba(253,252,249,.22);
  border-radius: 8px;
  color: #fdfcf9;
  font-size: 15px;
  cursor: pointer;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: rgba(253,252,249,.14); border-color: var(--peach); }

#hamburger { display: none; }

/* ── LAYOUT ── */
#layout {
  display: flex;
  margin-top: var(--header-h);
  min-height: calc(100vh - var(--header-h));
}

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  height: calc(100vh - var(--header-h));
  overflow-y: auto;
  position: sticky;
  top: var(--header-h);
  flex-shrink: 0;
  padding-bottom: 40px;
}
#sidebar::-webkit-scrollbar { width: 9px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9px; }

#sidebar-search-wrap { padding: 14px 14px 12px; }
#sidebar-search {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--surface-sunk);
  color: var(--text);
  outline: none;
}
#sidebar-search:focus { border-color: var(--teal-soft); background: var(--surface); }

.sidebar-section { border-top: 1px solid var(--border); }
.sidebar-section:first-child { border-top: none; }
.sidebar-section-header { display: flex; align-items: stretch; justify-content: space-between; user-select: none; }
.sidebar-section-title {
  flex: 1;
  padding: 12px 4px 11px 18px;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .10em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  cursor: pointer;
  transition: color .15s;
}
.sidebar-section-title:hover, .sidebar-section-title.active { color: var(--link); text-decoration: none; }

.chevron-btn { background: none; border: none; padding: 12px 16px 11px 4px; cursor: pointer; color: var(--border-strong); }
.chevron-btn:hover { color: var(--link); }
.sidebar-section-header .chevron { font-size: 9px; transition: transform .2s; display: inline-block; }
.sidebar-section.collapsed .chevron { transform: rotate(-90deg); }
.sidebar-section-links { list-style: none; padding-bottom: 8px; }
.sidebar-section.collapsed .sidebar-section-links { display: none; }
.sidebar-section-links li a {
  display: block;
  padding: 6px 14px 6px 18px;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 15px;
  color: var(--text);
  border-left: 3px solid transparent;
  line-height: 1.35;
  transition: background .12s, border-color .12s, color .12s;
}
.sidebar-section-links li a:hover {
  color: var(--link); background: var(--sage-wash); border-left-color: var(--mist); text-decoration: none;
}
.sidebar-section-links li a.active {
  color: var(--link); background: var(--sage-wash); border-left-color: var(--peach); font-weight: 600;
}
.sidebar-subgroup-divider {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-muted); padding: 14px 14px 5px 18px; list-style: none;
}
.sidebar-subgroup-divider:first-child { padding-top: 4px; }

/* ── MAIN ── */
#main { flex: 1; min-width: 0; background: var(--bg); }

#content {
  max-width: 940px;
  margin: 0 auto;
  background: var(--surface);
  padding: 40px 56px 72px;
  min-height: calc(100vh - var(--header-h));
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

/* ── BREADCRUMB ── */
#breadcrumb {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 14px; color: var(--text-muted); margin-bottom: 18px;
}
#breadcrumb a { color: var(--text-muted); }
#breadcrumb a:hover { color: var(--link); }
#breadcrumb span { margin: 0 6px; }
#breadcrumb span:first-child { margin-left: 0; }

/* ── ARTICLE TITLE ── */
.article-title {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 42px; font-weight: 800; letter-spacing: -.02em;
  color: var(--text); line-height: 1.1; margin-bottom: 10px;
}
.title-rule { width: 64px; height: 3px; background: var(--peach); border-radius: 2px; margin-bottom: 28px; }

/* ── TOC ── */
#toc {
  background: var(--sage-wash);
  border: 1px solid var(--border);
  border-left: 3px solid var(--sage);
  border-radius: var(--radius);
  padding: 18px 22px 20px;
  margin: 0 0 32px;
}
#toc-title {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 700; margin-bottom: 10px; font-size: 13px;
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted);
}
#toc ol { padding-left: 20px; columns: 2; column-gap: 32px; }
@media (max-width: 720px) { #toc ol { columns: 1; } }
#toc ol li { margin: 3px 0; break-inside: avoid; }
#toc ol li a { font-family: 'Outfit', system-ui, sans-serif; color: var(--link); font-size: 15px; }

/* ── ARTICLE BODY ── */
#article-body { max-width: 72ch; }
#article-body::after { content: ''; display: table; clear: both; }

#article-body h1, #article-body h2, #article-body h3, #article-body h4 {
  font-family: 'Outfit', system-ui, sans-serif;
  color: var(--text); letter-spacing: -.01em; scroll-margin-top: 80px;
}
#article-body h1 {
  font-size: 32px; font-weight: 700; line-height: 1.2;
  margin: 44px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule);
}
#article-body h2 {
  font-size: 26px; font-weight: 700; line-height: 1.25;
  margin: 40px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--rule);
}
#article-body h3 { font-size: 21px; font-weight: 600; margin: 30px 0 8px; }
#article-body h4 { font-size: 18px; font-weight: 600; margin: 22px 0 6px; color: var(--text-muted); }

#article-body p { margin: 0 0 16px; }
#article-body ul, #article-body ol { padding-left: 24px; margin: 10px 0 18px; }
#article-body li { margin: 5px 0; }
#article-body li::marker { color: var(--teal-soft); }
#article-body strong { font-weight: 600; }
#article-body em { font-style: italic; }

#article-body table {
  border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 16px;
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
}
#article-body th {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--sage-wash); color: var(--text); font-weight: 600; font-size: 15px;
  padding: 10px 14px; border-bottom: 1px solid var(--border-strong); text-align: left;
}
#article-body td { padding: 9px 14px; border-top: 1px solid var(--border); vertical-align: top; }
#article-body tbody tr:nth-child(even) td { background: var(--surface-sunk); }

#article-body blockquote {
  border-left: 3px solid var(--peach); margin: 22px 0; padding: 4px 0 4px 22px;
  color: var(--text-muted); font-style: italic; font-size: 19px; line-height: 1.6;
}

#article-body code {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px;
  background: var(--tan-wash); padding: 2px 6px; border-radius: 4px; color: var(--text);
}

#article-body hr { border: none; border-top: 1px solid var(--rule); margin: 34px 0; }

.wikilink-unresolved { color: var(--text-muted); border-bottom: 1px dotted var(--border-strong); }

/* ── RELATED ── */
#related-section { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--rule); }
#related-section h3 {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 13px; font-weight: 700; color: var(--text-muted);
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: .12em;
}
.related-pills { display: flex; flex-wrap: wrap; gap: 9px; }
.related-pill {
  display: inline-block; font-family: 'Outfit', system-ui, sans-serif;
  padding: 6px 15px; background: var(--peach-wash); color: var(--text);
  border-radius: 999px; font-size: 15px; text-decoration: none; border: 1px solid var(--border);
  transition: background .15s, color .15s, border-color .15s;
}
.related-pill:hover { background: var(--teal); color: #fdfcf9; border-color: var(--teal); text-decoration: none; }

/* ── HOME ── */
#home-header {
  background: var(--teal); color: #fdfcf9;
  padding: 56px 56px 52px; margin: -40px -56px 40px;
  position: relative; overflow: hidden;
}
#home-header::after {
  content: ''; position: absolute; right: -80px; top: -80px;
  width: 300px; height: 300px; border: 1.5px solid rgba(232,184,154,.30); border-radius: 50%;
}
#home-header .eyebrow {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--peach); margin-bottom: 14px; position: relative;
}
#home-header h1 {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: clamp(36px, 5vw, 58px); font-weight: 800; letter-spacing: -.025em;
  line-height: 1.04; margin-bottom: 16px; position: relative;
}
#home-header .subtitle {
  font-family: 'Zilla Slab', Georgia, serif;
  font-size: 19px; font-style: italic; line-height: 1.55;
  color: rgba(253,252,249,.85); max-width: 540px; position: relative;
}

.home-grid {
  display: grid; grid-template-columns: 1fr 300px; gap: 28px;
  margin-bottom: 48px; align-items: start;
}
@media (max-width: 860px) { .home-grid { grid-template-columns: 1fr; } }

.home-intro h2, .home-quick-nav h2 {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 14px; color: var(--text);
}
.home-intro p { margin-bottom: 14px; }
.home-intro p:first-of-type { font-size: 19px; line-height: 1.6; }

.home-quick-nav {
  background: var(--sage-wash); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px 24px 18px;
}
.home-quick-nav h2 { font-size: 20px; margin-bottom: 16px; }
.quick-nav-group { margin-bottom: 20px; }
.quick-nav-group:last-child { margin-bottom: 6px; }
.quick-nav-group h3 {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
  color: var(--text-muted); margin-bottom: 8px;
}
.quick-nav-group ul { list-style: none; }
.quick-nav-group ul li a {
  font-family: 'Outfit', system-ui, sans-serif; font-size: 15px; color: var(--link);
  display: block; padding: 3px 0;
}

.home-section-title {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--text); margin-bottom: 6px;
}
.home-section-subtitle { color: var(--text-muted); font-size: 17px; margin: 0 0 26px; max-width: 60ch; }

.cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
@media (max-width: 780px) { .cards-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 460px) { .cards-grid { grid-template-columns: 1fr; } }

.section-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 20px 18px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s;
  text-decoration: none; display: block; position: relative; overflow: hidden;
}
.section-card::before {
  content: ''; position: absolute; left: 0; top: 16px; bottom: 16px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--sage); transition: background .15s;
}
.section-card:hover {
  border-color: var(--teal-soft); box-shadow: var(--shadow); transform: translateY(-2px); text-decoration: none;
}
.section-card:hover::before { background: var(--peach); }
.section-card .card-icon { font-size: 20px; color: var(--teal-soft); margin-bottom: 10px; line-height: 1; }
.section-card .card-title {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--text);
  margin-bottom: 3px; display: block; text-decoration: none;
}
.section-card:hover .card-title { color: var(--link); }
.section-card .card-count { font-family: 'Outfit', system-ui, sans-serif; font-size: 14px; color: var(--text-muted); }
.section-card .card-links {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 15px;
}
.section-card .card-links a {
  font-family: 'Outfit', system-ui, sans-serif; display: block; color: var(--link);
  padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── SEARCH RESULTS ── */
.search-highlight { background: var(--tan-wash); border-radius: 3px; padding: 0 2px; color: var(--text); }
.result-row { padding: 18px 0; border-bottom: 1px solid var(--border); }
.result-row a.result-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 20px; font-weight: 600; color: var(--link); }
.result-row .result-section {
  font-family: 'Outfit', system-ui, sans-serif; font-size: 13px;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin: 4px 0 6px;
}
.result-row .result-snippet { font-size: 16px; color: var(--text-muted); line-height: 1.6; }

/* ── FOOTER ── */
#site-footer {
  margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--border);
  font-family: 'Outfit', system-ui, sans-serif; font-size: 14px; color: var(--text-muted);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}

/* ── MOBILE ── */
@media (max-width: 900px) {
  #hamburger { display: flex; }
  #sidebar {
    position: fixed; top: var(--header-h); left: -280px; width: 272px; z-index: 99;
    transition: left .25s ease; box-shadow: 4px 0 24px rgba(46,46,46,.18);
  }
  #sidebar.open { left: 0; }
  #content { padding: 26px 20px 56px; border-left: none; border-right: none; }
  #home-header { padding: 36px 20px 32px; margin: -26px -20px 28px; }
  .article-title { font-size: 32px; }
  #article-body { max-width: none; }
  #article-body table { display: block; overflow-x: auto; }
}
@media (max-width: 620px) {
  #header { padding: 0 12px; gap: 10px; }
  #header-logo .logo-word-2 { display: none; }
  #header-search { max-width: none; }
}

</style>
</head>
<body>

<header id="header">
  <button id="hamburger" class="icon-btn" onclick="toggleSidebar()" aria-label="Open navigation">&#9776;</button>
  <a href="#/" id="header-logo">
    <span class="logo-icon" aria-hidden="true"></span>
    <span>Human Design <span class="logo-word-2">Wiki</span></span>
  </a>
  <div id="header-search">
    <input type="search" id="header-search-input" placeholder="Search the wiki" oninput="handleHeaderSearch(this.value)" autocomplete="off">
  </div>
  <div id="header-tools">
    <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
  </div>
</header>

<div id="layout">
  <nav id="sidebar">
    <div id="sidebar-search-wrap">
      <input type="search" id="sidebar-search" placeholder="Filter articles..." oninput="handleSidebarSearch(this.value)" autocomplete="off">
    </div>
    <div id="sidebar-nav"></div>
  </nav>

  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
// ============================================================
// HD WIKI RUNTIME — markdown-first architecture (migrated 08.20.26)
// Content lives in content/<key>.md; nav + link data in manifest.json;
// full-text search in search-index.json (lazy-loaded).
// To add an article: drop a .md in content/ and run: node build.js
// ============================================================

let navSections = [], articlesMeta = {}, wikilinkMap = {}, WIKI = {};
let sidebarCollapsed = {};
const articleCache = {};
let searchIndex = null, searchIndexPromise = null;

function parseFrontmatter(raw) {
  if (!raw.startsWith('---')) return { meta: {}, content: raw };
  const end = raw.indexOf('\n---', 3);
  if (end < 0) return { meta: {}, content: raw };
  const head = raw.slice(3, end);
  const meta = {};
  for (const line of head.split('\n')) {
    const m = line.match(/^(\w[\w-]*):\s*(.*)$/);
    if (!m) continue;
    let v = m[2].trim();
    try { v = JSON.parse(v); } catch (e) { /* keep as string */ }
    meta[m[1]] = v;
  }
  return { meta, content: raw.slice(end + 4).replace(/^\n+/, '') };
}

async function getArticle(key) {
  if (articleCache[key]) return articleCache[key];
  if (!articlesMeta[key]) return null;
  const res = await fetch('content/' + key + '.md');
  if (!res.ok) return null;
  const parsed = parseFrontmatter(await res.text());
  const art = {
    title: parsed.meta.title || articlesMeta[key].title,
    section: parsed.meta.section || articlesMeta[key].section,
    related: parsed.meta.related || [],
    content: parsed.content
  };
  articleCache[key] = art;
  return art;
}

function ensureSearchIndex() {
  if (searchIndex) return Promise.resolve(searchIndex);
  if (!searchIndexPromise) {
    searchIndexPromise = fetch('search-index.json')
      .then(r => r.json())
      .then(j => { searchIndex = j; return j; });
  }
  return searchIndexPromise;
}

function resolveWikilink(text) {
  const lower = text.toLowerCase().trim();
  if (wikilinkMap[lower]) return '#/' + wikilinkMap[lower];
  for (const [k, v] of Object.entries(wikilinkMap)) {
    if (lower.includes(k) || k.includes(lower)) return '#/' + v;
  }
  return null;
}
// ── MARKDOWN RENDERER ──
function renderMarkdown(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inOl = false, inTable = false, tableHeader = false;
  let tableRows = [];

  function closeList() {
    if (inUl) { html += '</ul>\n'; inUl = false; }
    if (inOl) { html += '</ol>\n'; inOl = false; }
  }
  function closeTable() {
    if (inTable) {
      html += renderTable(tableRows);
      tableRows = [];
      inTable = false;
      tableHeader = false;
    }
  }

  function renderTable(rows) {
    if (rows.length === 0) return '';
    let out = '<table>\n';
    let headerDone = false;
    let sepIdx = -1;
    // Find separator row (---)
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].every(c => /^[-: ]+$/.test(c))) { sepIdx = i; break; }
    }
    rows.forEach((cells, idx) => {
      if (idx === sepIdx) return;
      const isHeader = (sepIdx > 0 && idx < sepIdx) || (sepIdx === -1 && idx === 0 && !headerDone);
      if (isHeader && !headerDone) {
        out += '<thead><tr>';
        cells.forEach(c => out += `<th>${inlineMarkdown(c.trim())}</th>`);
        out += '</tr></thead>\n<tbody>\n';
        headerDone = true;
      } else {
        out += '<tr>';
        cells.forEach(c => out += `<td>${inlineMarkdown(c.trim())}</td>`);
        out += '</tr>\n';
      }
    });
    if (!headerDone && rows.length > 0) {
      // No header found, render all as body
      out = '<table>\n<tbody>\n';
      rows.forEach(cells => {
        out += '<tr>';
        cells.forEach(c => out += `<td>${inlineMarkdown(c.trim())}</td>`);
        out += '</tr>\n';
      });
    }
    out += '</tbody>\n</table>\n';
    return out;
  }

  function inlineMarkdown(t) {
    // Wikilinks [[Text]] or [[Text|Display]]
    t = t.replace(/\[\[([^\]]+?)(?:\|([^\]]+?))?\]\]/g, (_, target, display) => {
      const label = display || target;
      const href = resolveWikilink(target);
      if (href) return `<a href="${href}">${label}</a>`;
      return `<span class="wikilink-unresolved">${label}</span>`;
    });
    // Bold+Italic
    t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    // Bold
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    // Inline code
    t = t.replace(/`([^`]+?)`/g, '<code>$1</code>');
    return t;
  }

  let paraLines = [];
  function flushPara() {
    if (paraLines.length > 0) {
      const joined = paraLines.join(' ').trim();
      if (joined) html += `<p>${inlineMarkdown(joined)}</p>\n`;
      paraLines = [];
    }
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // Table row
    if (/^\s*\|/.test(line)) {
      flushPara();
      closeList();
      inTable = true;
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (cells.length > 0) tableRows.push(cells);
      continue;
    } else if (inTable) {
      closeTable();
    }

    // Blank line
    if (/^\s*$/.test(line)) {
      flushPara();
      closeList();
      continue;
    }

    // Headings
    const h4 = line.match(/^####\s+(.+)/);
    const h3 = line.match(/^###\s+(.+)/);
    const h2 = line.match(/^##\s+(.+)/);
    const h1 = line.match(/^#\s+(.+)/);

    if (h4) {
      flushPara(); closeList();
      const slug = h4[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h4 id="${slug}">${inlineMarkdown(h4[1])}</h4>\n`;
    } else if (h3) {
      flushPara(); closeList();
      const slug = h3[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h3 id="${slug}">${inlineMarkdown(h3[1])}</h3>\n`;
    } else if (h2) {
      flushPara(); closeList();
      const slug = h2[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h2 id="${slug}">${inlineMarkdown(h2[1])}</h2>\n`;
    } else if (h1) {
      flushPara(); closeList();
      const slug = h1[1].toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += `<h1 id="${slug}">${inlineMarkdown(h1[1])}</h1>\n`;
    }
    // HR
    else if (/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())) {
      flushPara(); closeList();
      html += '<hr>\n';
    }
    // Blockquote
    else if (/^>\s?/.test(line)) {
      flushPara(); closeList();
      html += `<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ''))}</blockquote>\n`;
    }
    // Unordered list
    else if (/^\s*[-*+]\s+/.test(line)) {
      flushPara();
      if (!inUl) { html += '<ul>\n'; inUl = true; }
      if (inOl) { html += '</ol>\n'; inOl = false; }
      const content = line.replace(/^\s*[-*+]\s+/, '');
      html += `<li>${inlineMarkdown(content)}</li>\n`;
    }
    // Ordered list
    else if (/^\s*\d+\.\s+/.test(line)) {
      flushPara();
      if (!inOl) { html += '<ol>\n'; inOl = true; }
      if (inUl) { html += '</ul>\n'; inUl = false; }
      const content = line.replace(/^\s*\d+\.\s+/, '');
      html += `<li>${inlineMarkdown(content)}</li>\n`;
    }
    // Regular paragraph text
    else {
      paraLines.push(line);
    }
  }

  flushPara();
  closeList();
  closeTable();

  return html;
}

// ── TABLE OF CONTENTS ──
function navigateTo(href) {
  window.location.hash = href.replace(/^#/, '');
}

function scrollToSection(slug) {
  const el = document.getElementById(slug);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.pageYOffset - 20;
  try { window.scrollTo({ top, behavior: 'smooth' }); } catch (e) {}
  if (window.pageYOffset !== top) window.scrollTo(0, top);
}

function buildTOC(content) {
  const h2s = [];
  const lines = content.split('\n');
  for (const line of lines) {
    const m = line.match(/^##\s+(.+)/);
    if (m) h2s.push(m[1]);
  }
  if (h2s.length < 2) return '';
  let toc = '<div id="toc"><div id="toc-title">Contents</div><ol>';
  h2s.forEach((h, i) => {
    const slug = h.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    toc += `<li><a href="javascript:void(0)" onclick="scrollToSection('${slug}')">${h}</a></li>`;
  });
  toc += '</ol></div>';
  return toc;
}

function toggleSection(key) {
  sidebarCollapsed[key] = !sidebarCollapsed[key];
  renderSidebar(document.getElementById('sidebar-search').value);
}

function handleSidebarSearch(val) {
  renderSidebar(val.trim() || null);
}

// ── ROUTING ──
function getCurrentArticleKey() {
  const hash = window.location.hash;
  if (!hash || hash === '#/' || hash === '#') return null;
  return hash.replace(/^#\//, '');
}

function getBreadcrumb(key, article) {
  const sectionKey = key.split('/')[0];
  const section = navSections.find(s => s.key === sectionKey);
  const sectionLabel = section ? section.label : sectionKey;
  const isSectionPage = !key.includes('/');

  if (isSectionPage) {
    return `<span><a href="#/">Home</a></span>
      <span>&rsaquo;</span>
      <span>${sectionLabel}</span>`;
  }

  return `<span><a href="#/">Home</a></span>
    <span>&rsaquo;</span>
    <span><a href="#/${sectionKey}">${sectionLabel}</a></span>
    <span>&rsaquo;</span>
    <span>${article.title}</span>`;
}

// Content files repeat the title as a leading H1 and end with a
// "## Related Articles" wikilink list. Lift both out of the body so the
// title renders once and the related links render as pills.
function stripLeadingH1(md, title) {
  return md.replace(/^\s*#\s+(.+?)\s*\n+/, function (full, heading) {
    return heading.trim().toLowerCase() === String(title).trim().toLowerCase() ? '' : full;
  });
}

function splitRelated(md) {
  const m = md.match(/\n#{2,3}\s+Related Articles?\s*\n([\s\S]*)$/i);
  if (!m) return { body: md, raw: '' };
  return { body: md.slice(0, m.index), raw: m[1] };
}

function relatedPills(raw, fallback) {
  let names = [];
  const rx = /\[\[([^\]|]+?)(?:\|[^\]]*?)?\]\]/g;
  let m;
  while ((m = rx.exec(raw || '')) !== null) names.push(m[1].trim());
  if (!names.length && Array.isArray(fallback)) {
    names = fallback.map(s => String(s).replace(/[\[\]]/g, '').trim()).filter(Boolean);
  }
  const seen = new Set();
  const pills = [];
  for (const n of names) {
    const k = n.toLowerCase();
    if (!n || seen.has(k)) continue;
    seen.add(k);
    const href = resolveWikilink(n);
    if (href) pills.push('<a class="related-pill" href="' + href + '">' + n + '</a>');
  }
  return pills.join('');
}

function renderArticle(key, article) {
  const content = document.getElementById('content');
  const split = splitRelated(article.content);
  const source = stripLeadingH1(split.body, article.title);
  const toc = buildTOC(source);
  const body = renderMarkdown(source);
  const breadcrumb = getBreadcrumb(key, article);
  const pills = relatedPills(split.raw, article.related);

  content.innerHTML = `
    <div id="breadcrumb">${breadcrumb}</div>
    <h1 class="article-title">${article.title}</h1>
    <div class="title-rule"></div>
    ${toc}
    <div id="article-body">${body}</div>
    ${pills ? `<div id="related-section"><h3>Related Articles</h3><div class="related-pills">${pills}</div></div>` : ''}
    ${siteFooter()}
  `;
}

// ── SIDEBAR TOGGLE ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Close sidebar when clicking outside on mobile
document.addEventListener('click', function(e) {
  const sidebar = document.getElementById('sidebar');
  const hamburger = document.getElementById('hamburger');
  if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && e.target !== hamburger) {
      sidebar.classList.remove('open');
    }
  }
});


// ── SIDEBAR (async content filter via search index) ──
function renderSidebar(filter) {
  const nav = document.getElementById('sidebar-nav');
  const currentKey = getCurrentArticleKey();
  const f = filter ? filter.toLowerCase() : null;
  if (f && !searchIndex) { ensureSearchIndex().then(() => renderSidebar(filter)); }
  let html = '';
  for (const section of navSections) {
    const matchingArticles = f
      ? section.articles.filter(a =>
          a.divider ? false
          : a.label.toLowerCase().includes(f) ||
            (searchIndex && searchIndex[a.key] && searchIndex[a.key].x.toLowerCase().includes(f))
        )
      : section.articles;
    if (f && matchingArticles.length === 0) continue;
    const collapsed = !f && sidebarCollapsed[section.key];
    const sectionActive = section.key === currentKey ? ' active' : '';
    html += `<div class="sidebar-section${collapsed ? ' collapsed' : ''}" data-section="${section.key}">`;
    html += `<div class="sidebar-section-header">
      <a class="sidebar-section-title${sectionActive}" href="#/${section.key}">${section.label}</a>
      <button class="chevron-btn" onclick="toggleSection('${section.key}')" aria-label="Toggle ${section.label}"><span class="chevron">&#9660;</span></button>
    </div>`;
    html += '<ul class="sidebar-section-links">';
    for (const art of matchingArticles) {
      if (art.divider) { html += `<li class="sidebar-subgroup-divider">${art.divider}</li>`; continue; }
      const active = art.key === currentKey ? ' active' : '';
      html += `<li><a href="#/${art.key}" class="${active}">${art.label}</a></li>`;
    }
    html += '</ul></div>';
  }
  nav.innerHTML = html;
}

function handleHeaderSearch(val) {
  const q = val.trim();
  if (!q) { router(); return; }
  showSearchResults(q);
}

// ── ROUTER (async) ──
async function router() {
  const hash = window.location.hash;
  const content = document.getElementById('content');
  document.getElementById('header-search-input').value = '';

  if (!hash || hash === '#/' || hash === '#') {
    renderHome();
    renderSidebar(document.getElementById('sidebar-search').value);
    content.scrollTop = 0;
    window.scrollTo(0, 0);
    return;
  }

  const key = hash.replace(/^#\//, '');
  const article = await getArticle(key);

  if (!article) {
    content.innerHTML = `<h1 class="article-title">Not Found</h1><div class="title-rule"></div><p>No article matched &ldquo;${key}&rdquo;. Try the search box above, or head <a href="#/">back to the index</a>.</p>${siteFooter()}`;
    renderSidebar(document.getElementById('sidebar-search').value);
    return;
  }

  renderArticle(key, article);
  renderSidebar(document.getElementById('sidebar-search').value);
  content.scrollTop = 0;
  window.scrollTo(0, 0);
}

function siteFooter() {
  const n = Object.keys(articlesMeta).length;
  return `<footer id="site-footer">
    <span>Human Design Wiki &middot; ${n} articles</span>
    <span><a href="#/">Back to index</a></span>
  </footer>`;
}

// ── SEARCH RESULTS (index-based, async) ──
async function showSearchResults(query) {
  const content = document.getElementById('content');
  content.innerHTML = '<div id="breadcrumb"><a href="#/">Home</a> &rsaquo; Search</div><p style="color:var(--text-muted)">Searching&hellip;</p>';
  const idx = await ensureSearchIndex();
  const q = query.toLowerCase();
  const results = [];

  for (const [key, art] of Object.entries(idx)) {
    const titleMatch = art.t.toLowerCase().includes(q);
    const ci = art.x.toLowerCase().indexOf(q);
    if (titleMatch || ci >= 0) {
      let snippet = '';
      if (ci >= 0) {
        const start = Math.max(0, ci - 80);
        const end = Math.min(art.x.length, ci + 160);
        snippet = art.x.slice(start, end).replace(/\s+/g, ' ').trim();
        const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        snippet = snippet.replace(re, m => `<mark class="search-highlight">${m}</mark>`);
      }
      results.push({ key, t: art.t, s: art.s, titleMatch, snippet });
    }
  }

  results.sort((a, b) => (b.titleMatch ? 1 : 0) - (a.titleMatch ? 1 : 0));

  const items = results.map(r => `
    <div class="result-row">
      <a class="result-title" href="#/${r.key}">${r.t}</a>
      <div class="result-section">${r.s}</div>
      ${r.snippet ? `<div class="result-snippet">&hellip;${r.snippet}&hellip;</div>` : ''}
    </div>
  `).join('');

  content.innerHTML = `
    <div id="breadcrumb"><a href="#/">Home</a> &rsaquo; Search</div>
    <h1 class="article-title">&ldquo;${query}&rdquo;</h1>
    <div class="title-rule"></div>
    <p style="color:var(--text-muted); margin-bottom:8px">${results.length} article${results.length !== 1 ? 's' : ''} found</p>
    ${items || '<p>No articles found matching your search.</p>'}
    ${siteFooter()}
  `;
}

// ── THEME ──
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function syncThemeIcon() {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const dark = currentTheme() === 'dark';
  btn.innerHTML = dark ? '&#9788;' : '&#9789;';
  btn.setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('hdwiki-theme', next); } catch (e) {}
  syncThemeIcon();
}

// ── INIT ──
window.addEventListener('hashchange', router);
window.addEventListener('load', async () => {
  try {
    const res = await fetch('manifest.json');
    if (!res.ok) throw new Error('manifest fetch failed');
    const m = await res.json();
    WIKI = m.wiki || {};
    navSections = m.navSections || [];
    articlesMeta = m.articles || {};
    wikilinkMap = m.wikilinkMap || {};
    sidebarCollapsed = Object.fromEntries(navSections.map(s => [s.key, true]));
    syncThemeIcon();
    renderSidebar(null);
    router();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<h1 class="article-title">This wiki needs a web server</h1>' +
      '<p>Browsers block loading local content files when index.html is opened directly.</p>' +
      '<p><strong>Live site:</strong> visit the published URL (GitHub Pages / Netlify).</p>' +
      '<p><strong>Local preview:</strong> run <code>python3 -m http.server</code> in this folder, then open <code>http://localhost:8000</code>.</p>';
  }
});
